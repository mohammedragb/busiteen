<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><title>منصتي المدرسية</title>
<style>
:root{--c:#12314e;--cd:#0d2540;--c2:#eef2f7;--acc:#b78a2e;--bad:#b3382c;--ok:#157347;--r:14px;--sh:0 1px 2px #12314e0d,0 6px 18px #12314e12;--bd:#e3e9f0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,"Segoe UI",system-ui,Tahoma,sans-serif;background:#f3f5f8;color:#1c2b3a;min-height:100vh}
header{background:var(--cd);border-bottom:3px solid var(--acc);color:#fff;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0d254033}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px;font-weight:700;display:flex;align-items:center;gap:10px}
header h1 svg{flex:none}
header a{color:#dfe8f2;background:#ffffff14;padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13.5px;font-weight:500;transition:.15s;border:1px solid transparent}
header a:hover{background:#ffffff2a;color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px 16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{margin:4px 0 14px;font-size:20px;color:var(--c);font-weight:800;display:flex;align-items:center;gap:10px}
h2 .ic{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:var(--r);padding:18px 12px 14px;text-align:center;box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:inherit;border:1px solid var(--bd);font:inherit;font-weight:600;font-size:14.5px;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:10px}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px #12314e26;border-color:#c5d3e2}
.ic{width:46px;height:46px;border-radius:12px;background:var(--c2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:24px;height:24px}
.card:hover .ic{background:#e3ecf6}
.panel{background:#fff;border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--bd);overflow-x:auto}
.hero{background:var(--cd);border-bottom:3px solid var(--acc);color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.hero b{font-size:21px}.hero small{opacity:.8}.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.stats span{background:#ffffff17;border:1px solid #ffffff22;padding:6px 14px;border-radius:8px;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e6ecf2;padding:9px 10px;text-align:right}th{background:#f0f4f9;color:var(--c);font-weight:700;position:sticky;top:0}tr:hover td{background:#f8fafc}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #c9d5e0;border-radius:8px;max-width:100%;background:#fff;transition:.15s;color:#1c2b3a}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px #12314e22}
button.b{background:var(--c);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}
button.b:hover{background:#1b4066}button.b.g{background:#e8eef4;color:#233c52}button.b.g:hover{background:#dbe5ee}button.b.r{background:var(--bad)}button.b.s{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.msg{padding:10px 14px;border-radius:10px;background:var(--c2);margin:10px 0;border:1px solid #dfe7ef}.msg.ok{background:#e3f4ea;color:var(--ok);border-color:#c4e6d2}.msg.bad{background:#fbe9e6;color:var(--bad);border-color:#f2cfc9}
.abs{background:#fbe9e6}.sticky{position:sticky;bottom:8px;background:#fff;padding:12px;box-shadow:0 -2px 18px #0d254026;border:1px solid var(--bd);border-radius:var(--r);margin-top:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}.t1{background:#e3f4ea;color:var(--ok)}.t2{background:#fdf1d3;color:#8a6100}.t3{background:#fbe9e6;color:var(--bad)}
iframe{width:100%;height:75vh;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
.login{max-width:400px;margin:8vh auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 18px 50px #12314e2e;border-top:4px solid var(--acc);text-align:center}
.login h2{margin:0 0 4px;justify-content:center}.login input{width:100%;margin:6px 0}.login .logo{margin-bottom:6px}
.chips label{display:inline-block;margin:3px}
.sch{table-layout:fixed;border:1px solid #d4dde7}
.sch th,.sch td{border:1px solid #d4dde7;text-align:center;vertical-align:middle;padding:7px 5px;font-size:13px;word-wrap:break-word}
.sch th{background:var(--c);color:#fff;font-size:12.5px;font-weight:700}
.sch th.day{background:var(--cd)}
.sch td.day{background:#f0f4f9;font-weight:800;color:var(--c);width:64px}
.sch .les{background:#eaf1fa;color:#173a5c;font-weight:600}
.sch .les small{display:block;font-weight:400;color:#5a7186;font-size:11.5px}
.sch .dty{background:#fdf3dc;color:#6d4c00;font-weight:600}
.sch .dty small{display:block;font-weight:400;font-size:11.5px}
.sch .fre{background:#fbfcfe;color:#c3cdd8}
.sch .sup{background:#e7f6ee;color:#146c43;font-weight:700}
.rep-head{text-align:center;border-bottom:2px solid var(--c);padding-bottom:10px;margin-bottom:12px}
.rep-head h3{margin:0 0 2px;font-size:18px;color:var(--c)}
.rep-head div{font-size:13.5px;color:#3c5267}
.sign{display:flex;justify-content:space-between;margin-top:26px;font-size:13.5px;color:#3c5267;gap:20px;flex-wrap:wrap}
.pgbrk{page-break-after:always}
.printonly{display:none}
@media print{select{border:0;appearance:none;-webkit-appearance:none;background:none;font-weight:700;padding:0}header,.noprint,.sticky{display:none!important}body{background:#fff}.panel{box-shadow:none;border:0;padding:0}main{padding:0}.printonly{display:block}.sch th{background:#12314e!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sch .les,.sch .dty,.sch .sup,.sch td.day{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
body.ro .panel.noprint,body.ro .sticky,body.ro [data-d],body.ro .b.r{display:none!important}

</style></head><body>
<header><h1 id="ttl">منصتي المدرسية</h1><span id="nav" class="row" style="margin:0"></span></header>
<main id="app"></main>
<script>
"use strict";
/* ---------- storage ---------- */
const K="sp_v1";
const def=()=>({settings:{school:"اسم المدرسة",country:"الدولة",year:"2026/2027",monitorUrl:"",monitorMode:"link"},
 users:[],lastBackup:0,students:[],teachers:[],tt:[],cov:{},att:{},attQueue:[],rec:{},duty:[],archive:[]});
let D=Object.assign(def(),JSON.parse(localStorage.getItem(K)||"{}"));
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=$("#app");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- sections (same inventory as the reviewed platform) ---------- */
const FIELDS={
 behavior:{t:"المخالفات السلوكية",i:"⚠️",f:[["student","الطالب","stu"],["date","التاريخ","date"],["type","نوع المخالفة"],["action","الإجراء"]]},
 bulletin:{t:"النشرة الأسبوعية",i:"📰",f:[["week","الأسبوع"],["title","العنوان"],["body","المحتوى","area"]]},
 planning:{t:"التخطيط (خطة وSWOT)",i:"🧭",f:[["goal","الهدف"],["strength","قوة"],["weak","ضعف"],["opp","فرصة"],["threat","تهديد"]]},
 visits:{t:"الزيارات الصفية",i:"🏫",f:[["teacher","المعلم","tch"],["date","التاريخ","date"],["notes","الملاحظات","area"],["score","التقييم","number"]]},
 stations:{t:"محطات العمل",i:"🛠️",f:[["name","المحطة"],["owner","المسؤول"],["status","الحالة"]]},
 meetings:{t:"الاجتماعات",i:"👥",f:[["date","التاريخ","date"],["topic","الموضوع"],["minutes","المحضر","area"]]},
 topics:{t:"موضوعات الوقفات التقويمية",i:"📝",f:[["subject","المادة"],["topic","الموضوع"],["date","التاريخ","date"]]},
 meet2:{t:"اللقاء التربوي",i:"💬",f:[["date","التاريخ","date"],["topic","الموضوع"],["notes","ملاحظات","area"]]},
 survey:{t:"مقياس الرضا",i:"😊",f:[["group","الفئة"],["score","الدرجة (1-5)","number"],["comment","تعليق"]]},
 jobdata:{t:"تحديث البيانات الوظيفية",i:"📇",f:[["teacher","المعلم","tch"],["field","البند"],["value","القيمة"]]},
 paperwork:{t:"الأعمال الكتابية",i:"🗂️",f:[["item","العمل"],["due","الموعد","date"],["done","منجز؟","bool"]]},
 achievements:{t:"إنجازات المدرسة",i:"🏆",f:[["date","التاريخ","date"],["title","الإنجاز"],["details","التفاصيل","area"]]},
 transport:{t:"المواصلات",i:"🚌",f:[["route","الخط"],["driver","السائق"],["students","عدد الطلاب","number"]]},
 quality:{t:"مؤشرات الجودة",i:"📈",f:[["indicator","المؤشر"],["target","المستهدف","number"],["actual","الفعلي","number"]]},
 grades:{t:"تحليل الدرجات",i:"📊",f:[["student","الطالب","stu"],["subject","المادة"],["score","الدرجة","number"],["max","من","number"]]}
};
const CARDS=[["att","الغياب والتأخير"],["dash","لوحة المعلومات"],["behavior"],["bulletin"],["grades"],["planning"],["visits"],["stations"],["meetings"],["topics"],["meet2"],["lists","قوائم الصفوف"],["survey"],["monitor","جدول المراقبات"],["tsched"],["csched"],["cover","تأمين الحصص"],["timetable","الجدول المدرسي (الحصص)"],["jobdata"],["paperwork"],["achievements"],["transport"],["quality"],["report","تقرير الطالب الشامل"],["students","الطلاب"],["teachers","المعلمون"],["settings","الإعدادات والتجديد السنوي"]];
/* ---------- helpers ---------- */
const classes=()=>{const sc=scope();return [...new Set(D.students.map(s=>s.cls))].sort().filter(c=>!sc||sc.includes(c))};
const msg=(t,k="")=>`<div class="msg ${k}">${esc(t)}</div>`;
const today=()=>new Date().toISOString().slice(0,10);
function sheetLib(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("تعذر تحميل مكتبة Excel. تأكد من الإنترنت أو ارفع ملف CSV."));document.head.appendChild(s)})}
const nz=s=>String(s??"").replace(/^\ufeff/,"").replace(/[إأآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g," ").trim();
function parseCSV(t){t=t.replace(/^\ufeff/,"");return t.split(/\r?\n/).filter(x=>x.trim()).map(l=>{const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(!q&&(ch===","||ch===";"||ch==="\t")){o.push(c.trim());c=""}else c+=ch}o.push(c.trim());return o})}
async function readFile(f){
 if(/\.csv$/i.test(f.name))return parseCSV(await f.text());
 await sheetLib();const wb=XLSX.read(await f.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}).filter(r=>r.some(c=>String(c).trim()));
}
function download(name,rows){
 const csv="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();
}
function pick(kind,val){const l=kind==="stu"?D.students:D.teachers;return `<select data-k>${l.map(x=>`<option ${x.name===val?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`}

const V={};
/* ---------- accounts, roles, permissions (client-side, per device) ---------- */
const enc=new TextEncoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
 const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256);return{salt:b64(salt),hash:b64(bits)}}
const SECTION_KEYS=()=>CARDS.map(c=>c[0]).filter(k=>!["settings"].includes(k));
const ROLES={admin:"مدير النظام",manager:"مسؤول أقسام",teacher:"معلم",viewer:"اطلاع فقط"};
const ADMIN_ONLY=["settings","users"];
let ME=null;
const me=()=>ME&&D.users.find(u=>u.u===ME);
const can=k=>{const u=me();if(!u)return false;if(u.role==="admin")return true;if(ADMIN_ONLY.includes(k)||k==="home")return k==="home";if(k==="backup")return true;return (u.perms||[]).includes(k)};
const canWrite=k=>{const u=me();return !!u&&u.role!=="viewer"&&can(k)};
const scope=()=>{const u=me();return u&&u.role!=="admin"&&u.classes&&u.classes.length?u.classes:null};
function setupV(){app.innerHTML=`<div class="login"><div class="logo"><span class="ic" style="width:66px;height:66px;border-radius:16px"><svg viewBox="0 0 24 24" fill="none" stroke="#12314e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5V16c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5M21.5 9.5V15"/></svg></span></div><h2>إعداد المنصة</h2><p>أنشئ حساب مدير النظام. هذا الحساب هو الوحيد الذي يضيف المستخدمين ويحدد الصلاحيات.</p>
 <input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم" dir="ltr"><input id="p" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" dir="ltr"><input id="p2" type="password" placeholder="أعد كتابة كلمة المرور" dir="ltr"><button class="b" id="go" style="width:100%;margin-top:8px">إنشاء الحساب</button><div id="e"></div></div>`;
 $("#go").onclick=async()=>{const u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!u||p.length<8)return $("#e").innerHTML=msg("اسم المستخدم مطلوب وكلمة المرور 8 أحرف على الأقل","bad");if(p!==$("#p2").value)return $("#e").innerHTML=msg("كلمتا المرور غير متطابقتين","bad");
  const hp=await hashPw(p);D.users.push({u,name:$("#n").value.trim()||u,role:"admin",perms:[],classes:[],...hp});save();ME=u;sessionStorage.su=u;boot()}}
let fails=0,lockUntil=0;
function loginV(){app.innerHTML=`<div class="login"><div class="logo"><span class="ic" style="width:66px;height:66px;border-radius:16px"><svg viewBox="0 0 24 24" fill="none" stroke="#12314e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5V16c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5M21.5 9.5V15"/></svg></span></div><h2>${esc(D.settings.school)}</h2><p>${esc(D.settings.country)}</p><input id="u" placeholder="اسم المستخدم" dir="ltr" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password"><button class="b" id="go" style="width:100%;margin-top:8px">دخول</button><div id="e"></div></div>`;
 const go=async()=>{if(Date.now()<lockUntil)return $("#e").innerHTML=msg("محاولات كثيرة. انتظر "+Math.ceil((lockUntil-Date.now())/1000)+" ثانية","bad");
  const u=D.users.find(x=>x.u===$("#u").value.trim().toLowerCase());const ok=u&&(await hashPw($("#p").value,u.salt)).hash===u.hash;
  if(!ok){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return $("#e").innerHTML=msg("بيانات الدخول غير صحيحة","bad")}
  fails=0;ME=u.u;sessionStorage.su=u.u;boot()};$("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go()}}
function nav(){const u=me();$("#nav").innerHTML=u?`<a href="#/">الرئيسية</a>${can("backup")?'<a href="#/backup">نسخة احتياطية</a>':''}${u.role==="admin"?'<a href="#/users">المستخدمون</a><a href="#/settings">الإعدادات</a>':''}<a href="#" id="out">خروج (${esc(u.name)})</a>`:"";
 const o=$("#out");if(o)o.onclick=e=>{e.preventDefault();if(u.role==="admin"&&D.lastBackup<Date.now()-864e5&&confirm("لم تأخذ نسخة احتياطية اليوم. تحميلها الآن قبل الخروج؟"))exportFull();ME=null;sessionStorage.removeItem("su");boot()}}
function stamp(){return new Date().toISOString().slice(0,10)}
function fileOut(name,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}));a.download=name;a.click()}
function exportFull(){D.lastBackup=Date.now();save();fileOut("backup-"+stamp()+".json",D)}
/* export limited to what this user manages */
function exportMine(){const u=me(),sc=scope(),o={school:D.settings.school,exportedBy:u.u,at:new Date().toISOString(),sections:{}};
 const ok=k=>can(k);
 if(ok("students")||ok("att")||ok("lists")||ok("report"))o.sections.students=D.students.filter(s=>!sc||sc.includes(s.cls));
 if(ok("teachers"))o.sections.teachers=D.teachers;
 if(ok("timetable")||ok("cover"))o.sections.timetable=D.tt;
 if(ok("att")||ok("dash"))o.sections.attendance=Object.fromEntries(Object.entries(D.att).filter(([k])=>!sc||sc.includes(k.split("|")[0])));
 if(ok("cover"))o.sections.cover=D.cov;
 Object.keys(FIELDS).forEach(k=>{if(ok(k))o.sections[k]=D.rec[k]||[]});
 D.lastBackup=u.role==="admin"?Date.now():D.lastBackup;save();fileOut("my-data-"+u.u+"-"+stamp()+".json",o)}
V.backup=()=>{const u=me();const days=D.lastBackup?Math.floor((Date.now()-D.lastBackup)/864e5):null;
 app.innerHTML=`<h2>النسخ الاحتياطي والتصدير</h2><div class="panel"><p>آخر نسخة كاملة: <b>${D.lastBackup?new Date(D.lastBackup).toLocaleString("ar"):"لم تؤخذ بعد"}</b></p>
 ${u.role==="admin"?`<button class="b" id="f">نسخة كاملة بنقرة واحدة</button> `:""}<button class="b g" id="m">تصدير بياناتي (حسب صلاحياتي)</button>
 <p><small>الملف يتحمل على جهازك. احتفظ به في مكان آمن، لأنه يحتوي بيانات الطلاب.</small></p></div>
 ${u.role==="admin"?`<div class="panel"><b>تذكير تلقائي</b><div class="row"><label>ذكّرني كل <select id="r">${[0,1,3,7,14].map(n=>`<option value="${n}" ${+(D.settings.remind??7)===n?"selected":""}>${n?n+" يوم":"إيقاف"}</option>`).join("")}</select></label></div><small>المتصفح لا يسمح بحفظ ملف تلقائيا دون موافقتك، لذلك تظهر رسالة تذكير عند فتح المنصة وتحمل النسخة بنقرة.</small></div>`:""}`;
 if($("#f"))$("#f").onclick=()=>{exportFull();V.backup()};$("#m").onclick=exportMine;
 if($("#r"))$("#r").onchange=e=>{D.settings.remind=+e.target.value;save()}};
V.users=()=>{
 app.innerHTML=`<h2>المستخدمون والصلاحيات</h2><div class="panel"><b>إضافة مستخدم</b><div class="row"><input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم" dir="ltr"><input id="p" type="password" placeholder="كلمة مرور مؤقتة (8+)" dir="ltr"><select id="r">${["manager","teacher","viewer","admin"].map(r=>`<option value="${r}">${ROLES[r]}</option>`).join("")}</select></div>

/* ---------- timetable + class-cover engine ---------- */
const normDay=d=>{const n=nz(d).replace(/\s*\|.*$/,"");return ["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعة","السبت"].map((x,i)=>x===n?["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][i]:null).find(Boolean)||""};
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const dayOf=d=>DAYS[(new Date(d+"T12:00:00").getDay()+0)%7-0]; // Sun=0
const dayName=d=>["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(d+"T12:00:00").getDay()];
const isCoord=n=>{const t=D.teachers.find(x=>x.name===n);return !!t&&/^(نعم|yes|y|1|true|منسق)$/i.test((t.coord||"").trim())};
const deptRank=(n,dept)=>{const d=tdept(n);if(d===dept)return 0;const i=(D.settings.deptOrder||[]).indexOf(d);return i<0?100:i+1};
const tdept=n=>{const t=D.teachers.find(x=>x.name===n);return t?(t.dept||t.subject||""):""};

 $("#demo").onclick=()=>{if(!D.teachers.length){alert("حمّل البيانات التجريبية أولا من الإعدادات");return}
  D.tt=[];const cl=classes();DAYS.forEach((d,di)=>{for(let p=1;p<=6;p++)D.teachers.forEach((t,ti)=>{if((p+di+ti)%3!==0)D.tt.push({t:t.name,day:d,p:String(p),cls:cl[(p+ti)%cl.length]||"-",sub:t.subject})})});save();V.timetable()};
 $("#f").onchange=async e=>{try{let rows=await readFile(e.target.files[0]);rows=rows.map(r=>r.map(c=>String(c??"").replace(/^\ufeff/,"").trim()));const hd=rows[0];let rec=[];
  if(hd.some(c=>/المحتوى/.test(c))){ // class-grid flat format: class, day, period, "subject | teacher | subject | teacher"
   const ci=hd.findIndex(c=>/^الصف/.test(c)),di=hd.findIndex(c=>/اليوم/.test(c)),pi=hd.findIndex(c=>/الحصة/.test(c)),xi=hd.findIndex(c=>/المحتوى/.test(c));

/* engine: free in that period, not absent that day, not already covering that period; same dept first, then fewest covers (fairness) */
function suggest(date,absent){
 const day=dayName(date);const dayCov=D.cov[date]||{};
 const lessons=D.tt.filter(r=>r.day===day&&absent.includes(r.t)&&r.cls).sort((a,b)=>+a.p-+b.p);
 const busy=(n,p)=>D.tt.some(r=>r.t===n&&r.day===day&&r.p===p);
 const load={};Object.values(D.cov).forEach(m=>Object.values(m).forEach(c=>{if(c.sub)load[c.sub]=(load[c.sub]||0)+1}));
 const given={};
 return lessons.map(l=>{const key=l.t+"|"+l.p;const prev=dayCov[key];
  const free=D.teachers.map(t=>t.name).filter(n=>!absent.includes(n)&&!busy(n,l.p)&&!(given[l.p]||[]).includes(n));
  const dept=tdept(l.t);
  const reg=free.filter(n=>!isCoord(n)).sort((a,b)=>(deptRank(a,dept)-deptRank(b,dept))||((load[a]||0)-(load[b]||0)));
  const co=free.filter(isCoord).sort((a,b)=>(load[a]||0)-(load[b]||0));
  const cand=[...reg,...co];
  const pickN=prev&&prev.sub?prev.sub:(reg[0]||co[0]||"");if(pickN)(given[l.p]=given[l.p]||[]).push(pickN);
  return {key,l,cand,pick:pickN,dept,manual:!!(prev&&prev.manual)}});
}

const DUTY_W0=new Date(2026,10,1);
const sunOf=ds=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-d.getDay());return d};
const dutyWeek=sun=>Math.round((sun-DUTY_W0)/(7*864e5));
function dutyAssign(day,slot,w){const P=DPERIODS[slot];if(!P||!(D.duty||[]).length)return[];
 const rows=D.duty.filter(r=>r.day===day&&r.slot===slot).sort((a,b)=>a.ord-b.ord);
 const fixed={};rows.forEach(r=>{if(r.fixed)fixed[r.fixed]=r.t});
 const fL=new Set(Object.keys(fixed)),fN=new Set(Object.values(fixed));
 const slots=P.locs.filter(l=>!fL.has(l)),pool=rows.map(r=>r.t).filter(n=>!fN.has(n));
 while(pool.length>slots.length)slots.push("احتياط");
 const n=slots.length||1,out=[];
 P.locs.forEach(l=>{if(fL.has(l))out.push({loc:l,name:fixed[l],fixed:1})});
 slots.forEach((l,i)=>out.push({loc:l,name:pool[((i-w)%n+n)%n]||""}));
 const av=x=>{const r=rows.find(q=>q.t===x);return r&&r.avoid?new RegExp(r.avoid):null};
 out.forEach(r=>{const g=av(r.name);if(!r.fixed&&g&&g.test(r.loc)){const o=out.find(q=>!q.fixed&&q.name&&!av(q.name)&&!g.test(q.loc));if(o){const t=r.name;r.name=o.name;o.name=t}}});
 return out}

function repHead(title,sub){return `<div class="rep-head"><h3>${esc(D.settings.school)}</h3><div>${esc(D.settings.country)} - العام الدراسي ${esc(D.settings.year)}</div><div style="font-weight:800;color:#12314e;font-size:15px">${title}</div>${sub?`<div>${sub}</div>`:""}</div>`}
const PMAX=()=>Math.max(7,...D.tt.map(r=>+r.p||0));
const PNG_CSS=`*{box-sizing:border-box}body{font-family:Tajawal,Arial,sans-serif}.rep-head{text-align:center;border-bottom:2px solid #12314e;padding-bottom:10px;margin-bottom:12px}.rep-head h3{margin:0 0 2px;font-size:19px;color:#12314e}.rep-head div{font-size:13px;color:#3c5267}table{border-collapse:collapse;width:100%;table-layout:fixed}.sch th,.sch td,table.plain th,table.plain td{border:1px solid #9fb0c2;text-align:center;padding:7px 5px;font-size:13px;word-wrap:break-word}.sch th,table.plain th{background:#12314e;color:#fff;font-size:12.5px}.sch td.day{background:#f0f4f9;font-weight:800}.sch .les{background:#eaf1fa}.sch .les small{display:block;color:#5a7186;font-size:11px}.sch .dty{background:#fdf3dc}.sch .dty small{display:block;font-size:11px}.sch .fre{background:#fbfcfe;color:#c3cdd8}.sch .sup{background:#e7f6ee}.sign{display:flex;justify-content:space-between;margin-top:26px;font-size:13px;color:#3c5267;gap:20px}`;
function nodePNG(el,fname){
 const w=Math.max(el.offsetWidth,760),h=el.offsetHeight;
 const html=`<div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="background:#fff;padding:24px;width:${w}px"><style>${PNG_CSS}</style>${el.outerHTML}</div>`;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w+48}" height="${h+48}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
 const img=new Image();
 img.onload=()=>{const c=document.createElement("canvas");c.width=(w+48)*2;c.height=(h+48)*2;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.scale(2,2);x.drawImage(img,0,0);c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname;a.click()},"image/png")};
 img.onerror=()=>alert("تعذر إنشاء الصورة في هذا المتصفح. استخدم زر الطباعة واحفظ PDF.");
 img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
/* ---------- teacher weekly schedule (lessons + duties) ---------- */
function tGridHTML(tname,sun){
 const w=dutyWeek(sun),pn=PMAX();
 const les={};D.tt.filter(r=>r.t===tname).forEach(r=>{(les[r.day]=les[r.day]||{})[r.p]=r});
 const dcell=(day,slot)=>{const a=dutyAssign(day,slot,w).find(r=>r.name===tname);return a?`<td class="dty">${slot}<small>${esc(a.loc)}</small></td>`:`<td class="fre">-</td>`};
 const rows=DAYS.map(day=>{
  const L=les[day]||{};let tds="";
  for(let p=1;p<=pn;p++){const r=L[p];tds+=r?`<td class="les">${esc(r.sub)}<small>${esc(r.cls)}</small></td>`:`<td class="fre">-</td>`}
  const dm=dcell(day,"الفترة الصباحية"),d1=dcell(day,"الفسحة الأولى"),d2=dcell(day,"الفسحة الثانية");
  const d6=dutyAssign(day,"انصراف السادس",w).find(r=>r.name===tname),dp=dutyAssign(day,"انصراف أعدادي",w).find(r=>r.name===tname);
  const dd=(d6||dp)?`<td class="dty">${d6?"انصراف السادس<small>"+esc(d6.loc)+"</small>":""}${d6&&dp?"<hr style='margin:3px 0;border-color:#e5d5ac'>":""}${dp?"انصراف أعدادي<small>"+esc(dp.loc)+"</small>":""}</td>`:`<td class="fre">-</td>`;
  return `<tr><td class="day">${day}</td>${dm}${tds}${d1}${d2}${dd}</tr>`}).join("");
 let heads=`<th class="day">اليوم</th><th>الطابور<br><small style="font-weight:400">6:00-7:00</small></th>`;
 for(let p=1;p<=pn;p++)heads+=`<th>حصة ${p}</th>`;
 heads+=`<th>الفسحة الأولى<br><small style="font-weight:400">9:30-10:00</small></th><th>الفسحة الثانية<br><small style="font-weight:400">11:30-11:45</small></th><th>الانصراف<br><small style="font-weight:400">12:30 / 1:15</small></th>`;
 return `${repHead("الجدول الأسبوعي للمعلم: "+tname,"الأسبوع من "+fmtSun(sun)+(D.duty&&D.duty.length?"":" - المراقبات غير مستوردة"))}
 <table class="sch"><tr>${heads}</tr>${rows}</table>
 <div class="sign"><span>توقيع المعلم: ..............................</span><span>مسؤول المراقبات: ..............................</span><span>مدير المدرسة: ..............................</span></div>`}
V.tsched=()=>{
 const names=[...new Set([...D.teachers.map(t=>t.name),...D.tt.map(r=>r.t)])].sort((a,b)=>a.localeCompare(b,"ar"));
 app.innerHTML=`<h2><span class="ic">${icon("tsched")}</span> جدول المعلم الأسبوعي</h2>
 <div class="panel noprint"><div class="row"><label>المعلم <select id="t">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select></label>
 <label>أي يوم من الأسبوع <input type="date" id="d" value="${today()}"></label></div>
 <div class="row"><button class="b" id="pr">طباعة / PDF</button><button class="b g" id="png">حفظ كصورة</button><button class="b g" id="all">طباعة جداول كل المعلمين</button></div>
 ${(D.duty||[]).length?`<small>المراقبات مستوردة (${D.duty.length} سجل) وتتبدل أماكنها بالتدوير الأسبوعي تلقائيا.</small>`:`<div class="msg bad">المراقبات غير مستوردة بعد. ارفع ملف المراقبات (الأعمدة: اليوم، الفترة، الترتيب، المعلم، مكان ثابت اختياري، يتجنب اختياري) ليظهر الصباحي والفسح والانصراف في الجدول.</div><div class="row"><input type="file" id="df" accept=".csv,.xlsx,.xls"></div><div id="dout"></div>`}</div>
 <div class="panel" id="o"></div>`;
 const sun=()=>sunOf($("#d").value||today());
 const draw=()=>{$("#o").innerHTML=tGridHTML($("#t").value,sun())};
 $("#t").onchange=draw;$("#d").onchange=draw;draw();
 $("#pr").onclick=()=>print();
 $("#png").onclick=()=>nodePNG($("#o"),"teacher-"+$("#t").value.replace(/\s+/g,"-")+".png");
 $("#all").onclick=()=>{const s=sun();$("#o").innerHTML=names.map((n,i)=>`<div class="${i<names.length-1?"pgbrk":""}">${tGridHTML(n,s)}</div>`).join("");setTimeout(()=>print(),50);setTimeout(draw,500)};
 const df=$("#df");
 if(df)df.onchange=async e=>{try{let rows=await readFile(e.target.files[0]);rows=rows.map(r=>r.map(c=>String(c??"").replace(/^\ufeff/,"").trim()));
  const hd=rows[0],ci=re=>hd.findIndex(c=>re.test(c));
  const id=ci(/اليوم/),ip=ci(/الفترة/),io=ci(/الترتيب/),it=ci(/المعلم/),ix=ci(/مكان ثابت/),ia=ci(/يتجنب/);
  if(id<0||ip<0||it<0)throw new Error("الأعمدة المطلوبة: اليوم، الفترة، الترتيب، المعلم");
  const rec=rows.slice(1).map(r=>({day:normDay(r[id])||r[id],slot:r[ip],ord:+(r[io]||0)||0,t:r[it],fixed:ix>=0?r[ix]:"",avoid:ia>=0?r[ia]:""})).filter(o=>o.day&&o.slot&&o.t);
  $("#dout").innerHTML=msg(`${rec.length} سجل مراقبة. `)+`<button class="b" id="go">اعتماد (يستبدل الحالي)</button>`;
  $("#go").onclick=()=>{D.duty=rec;save();V.tsched()}}catch(er){$("#dout").innerHTML=msg(er.message,"bad")}};
};
/* ---------- class weekly timetable ---------- */
function cGridHTML(cls){
 const pn=PMAX();const les={};D.tt.filter(r=>r.cls===cls).forEach(r=>{(les[r.day]=les[r.day]||{})[r.p]=r});
 const rows=DAYS.map(day=>{const L=les[day]||{};let tds="";
  for(let p=1;p<=pn;p++){const r=L[p];tds+=r?`<td class="les">${esc(r.sub)}<small>${esc(r.t)}</small></td>`:`<td class="fre">-</td>`}
  return `<tr><td class="day">${day}</td>${tds}</tr>`}).join("");
 let heads=`<th class="day">اليوم</th>`;for(let p=1;p<=pn;p++)heads+=`<th>حصة ${p}</th>`;
 return `${repHead("الجدول الأسبوعي للفرقة: "+cls,(D.homeroom||{})[cls]?"مربي الصف: "+(D.homeroom||{})[cls]:"")}
 <table class="sch"><tr>${heads}</tr>${rows}</table>
 <div class="sign"><span>مربي الصف: ..............................</span><span>وكيل المدرسة: ..............................</span><span>مدير المدرسة: ..............................</span></div>`}
V.csched=()=>{
 const cl=classes();
 app.innerHTML=`<h2><span class="ic">${icon("csched")}</span> جدول الفرقة الأسبوعي</h2>
 <div class="panel noprint"><div class="row"><label>الفرقة <select id="c">${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label></div>
 <div class="row"><button class="b" id="pr">طباعة / PDF</button><button class="b g" id="png">حفظ كصورة</button><button class="b g" id="all">طباعة جداول كل الفرق</button></div>
 ${D.tt.length?"":msg("ارفع الجدول المدرسي أولا من قسم «الجدول المدرسي».","bad")}</div>
 <div class="panel" id="o"></div>`;
 const draw=()=>{$("#o").innerHTML=cl.length?cGridHTML($("#c").value):msg("لا توجد فرق بعد.")};
 $("#c").onchange=draw;draw();
 $("#pr").onclick=()=>print();
 $("#png").onclick=()=>nodePNG($("#o"),"class-"+$("#c").value.replace(/\W/g,"-")+".png");
 $("#all").onclick=()=>{$("#o").innerHTML=cl.map((c,i)=>`<div class="${i<cl.length-1?"pgbrk":""}">${cGridHTML(c)}</div>`).join("");setTimeout(()=>print(),50);setTimeout(draw,500)};
};

/* router: each section renders on demand, no page reloads */
function title(){$("#ttl").textContent=D.settings.school+" - "+D.settings.country;document.title=D.settings.school}
function route(){nav();if(!D.users.length)return setupV();if(!ME)return loginV();
 let k=(location.hash.replace(/^#\/?/,"")||"home").split("?")[0];if(k==="users"||k==="settings"){if(me().role!=="admin")k="home"}else if(!can(k)||(scope()&&k==="students"))k="home";
 (V[k]||V.home)();document.body.classList.toggle("ro",!canWrite(k)&&k!=="home"&&k!=="backup");scrollTo(0,0)}
function boot(){ME=sessionStorage.su&&D.users.some(u=>u.u===sessionStorage.su)?sessionStorage.su:null;title();route()}
addEventListener("hashchange",route);boot();
</script></body></html>
