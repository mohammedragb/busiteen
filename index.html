<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><title>منصتي المدرسية</title>
<style>
:root{--c:#10263f;--c2:#eef2f7;--acc:#c9a24a;--bad:#c0392b;--ok:#1b7f3b;--r:16px;--sh:0 2px 6px #10263f14,0 10px 30px #10263f14}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,"Segoe UI",system-ui,Tahoma,sans-serif;background:linear-gradient(180deg,#e7ecf3,#f7f8fb 300px);color:#17303b;min-height:100vh}
header{background:linear-gradient(135deg,#0c1d33,#1c3d63);border-bottom:2px solid var(--acc);color:#fff;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px #0b4f6c40}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
header a{color:#fff;background:#ffffff26;padding:7px 14px;border-radius:999px;text-decoration:none;font-size:14px;transition:.2s}header a:hover{background:#ffffff45}
main{max-width:1080px;margin:0 auto;padding:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:6px 0 14px;font-size:22px;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:var(--r);padding:20px 10px;text-align:center;box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:inherit;border:1px solid #e2edf2;font:inherit;font-weight:600;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #10263f33;border-color:var(--acc)}
.card .i{font-size:32px;display:block;margin-bottom:8px}
.panel{background:#fff;border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid #e8f0f4;overflow-x:auto}
.hero{background:linear-gradient(135deg,#0c1d33,#24507f);border:1px solid #c9a24a66;color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
.hero b{font-size:22px}.hero small{opacity:.85}.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.stats span{background:#ffffff24;padding:6px 14px;border-radius:999px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e6eef2;padding:9px 8px;text-align:right}th{background:var(--c2);color:var(--c);position:sticky;top:0}tr:hover td{background:#f7fbfd}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #c5d4dc;border-radius:10px;max-width:100%;background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px #c9a24a55}
button.b{background:linear-gradient(135deg,#10263f,#24507f);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}
button.b:hover{filter:brightness(1.12);transform:translateY(-1px)}button.b.g{background:#e3edf2;color:#17303b}button.b.r{background:var(--bad)}button.b.s{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.msg{padding:10px 14px;border-radius:12px;background:var(--c2);margin:10px 0}.msg.ok{background:#dff3e5;color:var(--ok)}.msg.bad{background:#fbe3e1;color:var(--bad)}
.abs{background:#fbe3e1}.sticky{position:sticky;bottom:8px;background:#fff;padding:12px;box-shadow:0 -2px 18px #0b4f6c33;border-radius:var(--r);margin-top:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}.t1{background:#dff3e5;color:var(--ok)}.t2{background:#fff1cc;color:#8a6100}.t3{background:#fbe3e1;color:var(--bad)}
iframe{width:100%;height:75vh;border:1px solid #ccd;border-radius:var(--r);background:#fff}
@media print{header,.noprint,.sticky{display:none}body{background:#fff}.panel{box-shadow:none}}
.login{max-width:400px;margin:8vh auto;background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 60px #10263f33;border-top:4px solid var(--acc);text-align:center}
.login h2{margin:0 0 4px}.login input{width:100%;margin:6px 0}.login .logo{font-size:44px}
.card .i{filter:drop-shadow(0 2px 3px #0003)}.card:hover{background:linear-gradient(180deg,#fff,#faf5e8)}
.chips label{display:inline-block;margin:3px}
body.ro .panel.noprint,body.ro .sticky,body.ro [data-d],body.ro .b.r{display:none!important}
</style></head><body>
<header><h1 id="ttl">منصتي المدرسية</h1><span id="nav" class="row" style="margin:0"></span></header>
<main id="app"></main>
<script>
"use strict";
/* ---------- storage ---------- */
const K="sp_v1";
const def=()=>({settings:{school:"اسم المدرسة",country:"الدولة",year:"2026/2027",monitorUrl:"",monitorMode:"link"},
 users:[],lastBackup:0,students:[],teachers:[],tt:[],cov:{},att:{},attQueue:[],rec:{},archive:[]});
let D=Object.assign(def(),JSON.parse(localStorage.getItem(K)||"{}"));
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=$("#app");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- sections (same inventory as the reviewed platform) ---------- */
const FIELDS={
 behavior:{t:"المخالفات السلوكية",i:"⚠️",f:[["student","الطالب","stu"],["date","التاريخ","date"],["type","نوع المخالفة"],["action","الإجراء"]]},
 bulletin:{t:"النشرة الأسبوعية",i:"📰",f:[["week","الأسبوع"],["title","العنوان"],["body","المحتوى","area"]]},
 planning:{t:"التخطيط (خطة وSWOT)",i:"🧭",f:[["goal","الهدف"],["strength","قوة"],["weak","ضعف"],["opp","فرصة"],["threat","تهديد"]]},
 visits:{t:"الزيارات الصفية",i:"🏫",f:[["teacher","المعلم","tch"],["date","التاريخ","date"],["notes","الملاحظات","area"],["score","التقييم","number"]]},
 stations:{t:"محطات العمل",i:"🛠️",f:[["name","المحطة"],["owner","المسؤول"],["status","الحالة"]]},
 meetings:{t:"الاجتماعات",i:"👥",f:[["date","التاريخ","date"],["topic","الموضوع"],["minutes","المحضر","area"]]},
 topics:{t:"موضوعات الوقفات التقويمية",i:"📝",f:[["subject","المادة"],["topic","الموضوع"],["date","التاريخ","date"]]},
 meet2:{t:"اللقاء التربوي",i:"💬",f:[["date","التاريخ","date"],["topic","الموضوع"],["notes","ملاحظات","area"]]},
 survey:{t:"مقياس الرضا",i:"😊",f:[["group","الفئة"],["score","الدرجة (1-5)","number"],["comment","تعليق"]]},
 jobdata:{t:"تحديث البيانات الوظيفية",i:"📇",f:[["teacher","المعلم","tch"],["field","البند"],["value","القيمة"]]},
 paperwork:{t:"الأعمال الكتابية",i:"🗂️",f:[["item","العمل"],["due","الموعد","date"],["done","منجز؟","bool"]]},
 achievements:{t:"إنجازات المدرسة",i:"🏆",f:[["date","التاريخ","date"],["title","الإنجاز"],["details","التفاصيل","area"]]},
 transport:{t:"المواصلات",i:"🚌",f:[["route","الخط"],["driver","السائق"],["students","عدد الطلاب","number"]]},
 quality:{t:"مؤشرات الجودة",i:"📈",f:[["indicator","المؤشر"],["target","المستهدف","number"],["actual","الفعلي","number"]]},
 grades:{t:"تحليل الدرجات",i:"📊",f:[["student","الطالب","stu"],["subject","المادة"],["score","الدرجة","number"],["max","من","number"]]}
};
const CARDS=[["att","الغياب والتأخير","📋"],["dash","لوحة المعلومات","🖥️"],["behavior"],["bulletin"],["grades"],["planning"],["visits"],["stations"],["meetings"],["topics"],["meet2"],["lists","قوائم الصفوف","📄"],["survey"],["monitor","جدول المراقبات","🗓️"],["cover","تأمين الحصص","🔄"],["timetable","الجدول المدرسي (الحصص)","🕘"],["jobdata"],["paperwork"],["achievements"],["transport"],["quality"],["report","تقرير الطالب الشامل","🎓"],["students","الطلاب","🧑‍🎓"],["teachers","المعلمون","👩‍🏫"],["settings","الإعدادات والتجديد السنوي","⚙️"]];
/* ---------- helpers ---------- */
const classes=()=>{const sc=scope();return [...new Set(D.students.map(s=>s.cls))].sort().filter(c=>!sc||sc.includes(c))};
const msg=(t,k="")=>`<div class="msg ${k}">${esc(t)}</div>`;
const today=()=>new Date().toISOString().slice(0,10);
function sheetLib(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("تعذر تحميل مكتبة Excel. تأكد من الإنترنت أو ارفع ملف CSV."));document.head.appendChild(s)})}
const nz=s=>String(s??"").replace(/^\ufeff/,"").replace(/[إأآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g," ").trim();
function parseCSV(t){t=t.replace(/^\ufeff/,"");return t.split(/\r?\n/).filter(x=>x.trim()).map(l=>{const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(!q&&(ch===","||ch===";"||ch==="\t")){o.push(c.trim());c=""}else c+=ch}o.push(c.trim());return o})}
async function readFile(f){
 if(/\.csv$/i.test(f.name))return parseCSV(await f.text());
 await sheetLib();const wb=XLSX.read(await f.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}).filter(r=>r.some(c=>String(c).trim()));
}
function download(name,rows){
 const csv="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();
}
function pick(kind,val){const l=kind==="stu"?D.students:D.teachers;return `<select data-k>${l.map(x=>`<option ${x.name===val?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`}

const V={};
/* ---------- accounts, roles, permissions (client-side, per device) ---------- */
const enc=new TextEncoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
 const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256);return{salt:b64(salt),hash:b64(bits)}}
const SECTION_KEYS=()=>CARDS.map(c=>c[0]).filter(k=>!["settings"].includes(k));
const ROLES={admin:"مدير النظام",manager:"مسؤول أقسام",teacher:"معلم",viewer:"اطلاع فقط"};
const ADMIN_ONLY=["settings","users"];
let ME=null;
const me=()=>ME&&D.users.find(u=>u.u===ME);
const can=k=>{const u=me();if(!u)return false;if(u.role==="admin")return true;if(ADMIN_ONLY.includes(k)||k==="home")return k==="home";if(k==="backup")return true;return (u.perms||[]).includes(k)};
const canWrite=k=>{const u=me();return !!u&&u.role!=="viewer"&&can(k)};
const scope=()=>{const u=me();return u&&u.role!=="admin"&&u.classes&&u.classes.length?u.classes:null};
function setupV(){app.innerHTML=`<div class="login"><div class="logo">🎓</div><h2>إعداد المنصة</h2><p>أنشئ حساب مدير النظام. هذا الحساب هو الوحيد الذي يضيف المستخدمين ويحدد الصلاحيات.</p>
 <input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم" dir="ltr"><input id="p" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" dir="ltr"><input id="p2" type="password" placeholder="أعد كتابة كلمة المرور" dir="ltr"><button class="b" id="go" style="width:100%;margin-top:8px">إنشاء الحساب</button><div id="e"></div></div>`;
 $("#go").onclick=async()=>{const u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!u||p.length<8)return $("#e").innerHTML=msg("اسم المستخدم مطلوب وكلمة المرور 8 أحرف على الأقل","bad");if(p!==$("#p2").value)return $("#e").innerHTML=msg("كلمتا المرور غير متطابقتين","bad");
  const hp=await hashPw(p);D.users.push({u,name:$("#n").value.trim()||u,role:"admin",perms:[],classes:[],...hp});save();ME=u;sessionStorage.su=u;boot()}}
let fails=0,lockUntil=0;
function loginV(){app.innerHTML=`<div class="login"><div class="logo">🎓</div><h2>${esc(D.settings.school)}</h2><p>${esc(D.settings.country)}</p><input id="u" placeholder="اسم المستخدم" dir="ltr" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password"><button class="b" id="go" style="width:100%;margin-top:8px">دخول</button><div id="e"></div></div>`;
 const go=async()=>{if(Date.now()<lockUntil)return $("#e").innerHTML=msg("محاولات كثيرة. انتظر "+Math.ceil((lockUntil-Date.now())/1000)+" ثانية","bad");
  const u=D.users.find(x=>x.u===$("#u").value.trim().toLowerCase());const ok=u&&(await hashPw($("#p").value,u.salt)).hash===u.hash;
  if(!ok){if(++fails>=5){lockUntil=Date.now()+30000;fails=0}return $("#e").innerHTML=msg("بيانات الدخول غير صحيحة","bad")}
  fails=0;ME=u.u;sessionStorage.su=u.u;boot()};$("#go").onclick=go;$("#p").onkeydown=e=>{if(e.key==="Enter")go()}}
function nav(){const u=me();$("#nav").innerHTML=u?`<a href="#/">الرئيسية</a>${can("backup")?'<a href="#/backup">نسخة احتياطية</a>':''}${u.role==="admin"?'<a href="#/users">المستخدمون</a><a href="#/settings">الإعدادات</a>':''}<a href="#" id="out">خروج (${esc(u.name)})</a>`:"";
 const o=$("#out");if(o)o.onclick=e=>{e.preventDefault();if(u.role==="admin"&&D.lastBackup<Date.now()-864e5&&confirm("لم تأخذ نسخة احتياطية اليوم. تحميلها الآن قبل الخروج؟"))exportFull();ME=null;sessionStorage.removeItem("su");boot()}}
function stamp(){return new Date().toISOString().slice(0,10)}
function fileOut(name,obj){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:"application/json"}));a.download=name;a.click()}
function exportFull(){D.lastBackup=Date.now();save();fileOut("backup-"+stamp()+".json",D)}
/* export limited to what this user manages */
function exportMine(){const u=me(),sc=scope(),o={school:D.settings.school,exportedBy:u.u,at:new Date().toISOString(),sections:{}};
 const ok=k=>can(k);
 if(ok("students")||ok("att")||ok("lists")||ok("report"))o.sections.students=D.students.filter(s=>!sc||sc.includes(s.cls));
 if(ok("teachers"))o.sections.teachers=D.teachers;
 if(ok("timetable")||ok("cover"))o.sections.timetable=D.tt;
 if(ok("att")||ok("dash"))o.sections.attendance=Object.fromEntries(Object.entries(D.att).filter(([k])=>!sc||sc.includes(k.split("|")[0])));
 if(ok("cover"))o.sections.cover=D.cov;
 Object.keys(FIELDS).forEach(k=>{if(ok(k))o.sections[k]=D.rec[k]||[]});
 D.lastBackup=u.role==="admin"?Date.now():D.lastBackup;save();fileOut("my-data-"+u.u+"-"+stamp()+".json",o)}
V.backup=()=>{const u=me();const days=D.lastBackup?Math.floor((Date.now()-D.lastBackup)/864e5):null;
 app.innerHTML=`<h2>النسخ الاحتياطي والتصدير</h2><div class="panel"><p>آخر نسخة كاملة: <b>${D.lastBackup?new Date(D.lastBackup).toLocaleString("ar"):"لم تؤخذ بعد"}</b></p>
 ${u.role==="admin"?`<button class="b" id="f">⬇️ نسخة كاملة بنقرة واحدة</button> `:""}<button class="b g" id="m">⬇️ تصدير بياناتي (حسب صلاحياتي)</button>
 <p><small>الملف يتحمل على جهازك. احتفظ به في مكان آمن، لأنه يحتوي بيانات الطلاب.</small></p></div>
 ${u.role==="admin"?`<div class="panel"><b>تذكير تلقائي</b><div class="row"><label>ذكّرني كل <select id="r">${[0,1,3,7,14].map(n=>`<option value="${n}" ${+(D.settings.remind??7)===n?"selected":""}>${n?n+" يوم":"إيقاف"}</option>`).join("")}</select></label></div><small>المتصفح لا يسمح بحفظ ملف تلقائيا دون موافقتك، لذلك تظهر رسالة تذكير عند فتح المنصة وتحمل النسخة بنقرة.</small></div>`:""}`;
 if($("#f"))$("#f").onclick=()=>{exportFull();V.backup()};$("#m").onclick=exportMine;
 if($("#r"))$("#r").onchange=e=>{D.settings.remind=+e.target.value;save()}};
V.users=()=>{
 app.innerHTML=`<h2>المستخدمون والصلاحيات</h2><div class="panel"><b>إضافة مستخدم</b><div class="row"><input id="n" placeholder="الاسم"><input id="u" placeholder="اسم المستخدم" dir="ltr"><input id="p" type="password" placeholder="كلمة مرور مؤقتة (8+)" dir="ltr"><select id="r">${["manager","teacher","viewer","admin"].map(r=>`<option value="${r}">${ROLES[r]}</option>`).join("")}</select></div>
 <div class="chips"><small>الأقسام المسموح بها:</small><br>${CARDS.filter(c=>!ADMIN_ONLY.includes(c[0])).map(c=>`<label><input type="checkbox" data-p="${c[0]}"> ${esc(c[1]||FIELDS[c[0]].t)}</label>`).join("")}</div>
 <div class="row"><input id="cl" placeholder="حصر في فرق معينة، مثال: 7/1,7/2 (اتركه فارغا للكل)" style="flex:1"></div><button class="b" id="add">إضافة</button><div id="e"></div></div>
 <div class="panel"><table><tr><th>المستخدم</th><th>الدور</th><th>الأقسام</th><th>الفرق</th><th></th></tr>${D.users.map((x,i)=>`<tr><td>${esc(x.name)}<br><small dir="ltr">${esc(x.u)}</small></td><td>${ROLES[x.role]}</td><td>${x.role==="admin"?"الكل":esc((x.perms||[]).map(k=>(CARDS.find(c=>c[0]===k)||[])[1]||(FIELDS[k]||{}).t||k).join("، "))}</td><td>${esc((x.classes||[]).join("، ")||"الكل")}</td><td><button class="b g s" data-pw="${i}">كلمة مرور</button> <button class="b r s" data-del="${i}">حذف</button></td></tr>`).join("")}</table></div>`;
 $("#add").onclick=async()=>{const u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!u||p.length<8)return $("#e").innerHTML=msg("اسم المستخدم وكلمة مرور 8+ مطلوبان","bad");if(D.users.some(x=>x.u===u))return $("#e").innerHTML=msg("اسم المستخدم مستخدم","bad");
  const hp=await hashPw(p);D.users.push({u,name:$("#n").value.trim()||u,role:$("#r").value,perms:[...app.querySelectorAll("[data-p]:checked")].map(x=>x.dataset.p),classes:$("#cl").value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),...hp});save();V.users()};
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const x=D.users[+b.dataset.del];if(x.u===ME)return alert("لا يمكن حذف حسابك");if(D.users.filter(y=>y.role==="admin").length<2&&x.role==="admin")return;if(confirm("حذف "+x.name+"؟")){D.users.splice(+b.dataset.del,1);save();V.users()}});
 app.querySelectorAll("[data-pw]").forEach(b=>b.onclick=async()=>{const p=prompt("كلمة المرور الجديدة (8+)");if(!p||p.length<8)return;Object.assign(D.users[+b.dataset.pw],await hashPw(p));save();alert("تم التغيير")});
};
/* ---------- views ---------- */

V.home=()=>{
 app.innerHTML=`<div class="hero"><b>${esc(D.settings.school)}</b><br><small>${esc(D.settings.country)} - ${esc(D.settings.year)} - البيانات محفوظة على جهازك فقط</small><div class="stats"><span>${D.students.length} طالب</span><span>${D.teachers.length} معلم</span><span>${(D.tt||[]).length} حصة في الجدول</span></div></div>
 ${D.students.length?"":msg("ابدأ من «الإعدادات» وحمّل بيانات تجريبية أو ارفع ملف Excel.")}
 ${remindBanner()}<div class="grid">${CARDS.filter(c=>can(c[0])).map(([k,t,i])=>{const f=FIELDS[k];return `<a class="card" href="#/${k}"><span class="i">${i||f.i}</span>${t||f.t}</a>`}).join("")}</div>`;
};
V.students=()=>listView("students","الطلاب",[["name","الاسم"],["id","الرقم الشخصي"],["cls","الفرقة/الصف"]],true);

const normDay=d=>{const n=nz(d).replace(/\s*\|.*$/,"");return ["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعة","السبت"].map((x,i)=>x===n?["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][i]:null).find(Boolean)||""};
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const dayOf=d=>DAYS[(new Date(d+"T12:00:00").getDay()+0)%7-0]; // Sun=0
const dayName=d=>["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(d+"T12:00:00").getDay()];
const isCoord=n=>{const t=D.teachers.find(x=>x.name===n);return !!t&&/^(نعم|yes|y|1|true|منسق)$/i.test((t.coord||"").trim())};
const deptRank=(n,dept)=>{const d=tdept(n);if(d===dept)return 0;const i=(D.settings.deptOrder||[]).indexOf(d);return i<0?100:i+1};
const tdept=n=>{const t=D.teachers.find(x=>x.name===n);return t?(t.dept||t.subject||""):""};

/* engine: free in that period, not absent that day, not already covering that period; same dept first, then fewest covers (fairness) */
function suggest(date,absent){
 const day=dayName(date);const dayCov=D.cov[date]||{};
 const lessons=D.tt.filter(r=>r.day===day&&absent.includes(r.t)&&r.cls).sort((a,b)=>+a.p-+b.p);
 const busy=(n,p)=>D.tt.some(r=>r.t===n&&r.day===day&&r.p===p);
 const load={};Object.values(D.cov).forEach(m=>Object.values(m).forEach(c=>{if(c.sub)load[c.sub]=(load[c.sub]||0)+1}));
 const given={};
 return lessons.map(l=>{const key=l.t+"|"+l.p;const prev=dayCov[key];
  const free=D.teachers.map(t=>t.name).filter(n=>!absent.includes(n)&&!busy(n,l.p)&&!(given[l.p]||[]).includes(n));
  const dept=tdept(l.t);
  const reg=free.filter(n=>!isCoord(n)).sort((a,b)=>(deptRank(a,dept)-deptRank(b,dept))||((load[a]||0)-(load[b]||0)));
  const co=free.filter(isCoord).sort((a,b)=>(load[a]||0)-(load[b]||0));
  const cand=[...reg,...co];
  const pickN=prev&&prev.sub?prev.sub:(reg[0]||co[0]||"");if(pickN)(given[l.p]=given[l.p]||[]).push(pickN);
  return {key,l,cand,pick:pickN,dept,manual:!!(prev&&prev.manual)}});
}

};
function remindBanner(){const u=me(),d=+(D.settings.remind??7);if(!u||u.role!=="admin"||!d)return "";const age=(Date.now()-D.lastBackup)/864e5;return age>d?`<div class="msg bad">آخر نسخة احتياطية ${D.lastBackup?Math.floor(age)+" يوم":"لم تؤخذ"}. <a href="#/backup">حمّل نسخة الآن</a></div>`:""}
function genericView(key){
 const cfg=FIELDS[key];const L=(D.rec[key]=D.rec[key]||[]);
 const inp=([k,l,t])=>t==="stu"?`<label>${l} ${pick("stu")}</label>`.replace("data-k",`id="f_${k}"`):t==="tch"?`<label>${l} ${pick("tch")}</label>`.replace("data-k",`id="f_${k}"`):t==="area"?`<textarea id="f_${k}" placeholder="${l}"></textarea>`:t==="bool"?`<label><input type="checkbox" id="f_${k}"> ${l}</label>`:`<input id="f_${k}" placeholder="${l}" ${t?`type="${t}"`:""}>`;
 let extra="";
 if(key==="grades"&&L.length){const bySub={};L.forEach(r=>{(bySub[r.subject]=bySub[r.subject]||[]).push(100*r.score/(r.max||100))});extra=`<div class="panel"><b>المتوسط حسب المادة</b><table>${Object.entries(bySub).map(([s,a])=>`<tr><td>${esc(s)}</td><td>${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)}%</td></tr>`).join("")}</table></div>`}
 if(key==="quality"&&L.length)extra=`<div class="panel">${L.map(r=>`<div>${esc(r.indicator)}: ${esc(r.actual)} / ${esc(r.target)}<progress max="${+r.target||100}" value="${+r.actual||0}" style="width:100%"></progress></div>`).join("")}</div>`;
 app.innerHTML=`<h2>${cfg.t}</h2><div class="panel noprint"><div class="row">${cfg.f.map(inp).join("")}</div><button class="b" id="add">إضافة</button></div>${extra}
 <div class="panel"><div class="row noprint"><button class="b g" id="x">تصدير CSV</button></div><table><tr>${cfg.f.map(f=>`<th>${f[1]}</th>`).join("")}<th class="noprint"></th></tr>${L.map((r,i)=>`<tr>${cfg.f.map(([k])=>`<td>${esc(r[k]===true?"نعم":r[k]===false?"لا":r[k])}</td>`).join("")}<td class="noprint"><button class="b r" data-d="${i}">حذف</button></td></tr>`).join("")}</table></div>`;
 $("#add").onclick=()=>{const o={};cfg.f.forEach(([k,,t])=>{const e=$("#f_"+k);o[k]=t==="bool"?e.checked:e.value});L.push(o);save();V[key]()};
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{L.splice(+b.dataset.d,1);save();V[key]()});
 $("#x").onclick=()=>download(key+".csv",[cfg.f.map(f=>f[1]),...L.map(r=>cfg.f.map(([k])=>r[k]))]);
}
Object.keys(FIELDS).forEach(k=>V[k]=()=>genericView(k));
/* settings + yearly renewal */
V.settings=()=>{
 const s=D.settings;const cl=classes();
 app.innerHTML=`<h2>الإعدادات</h2><div class="panel"><div class="row"><input id="sc" value="${esc(s.school)}" placeholder="اسم المدرسة"><input id="co" value="${esc(s.country)}" placeholder="الدولة"><input id="yr" value="${esc(s.year)}" placeholder="العام الدراسي"></div>
 <div class="row"><label style="width:100%">أولوية الأقسام للتأمين (قسم في كل سطر، الأول أعلى أولوية)<br><textarea id="do" rows="4" style="width:100%">${esc((s.deptOrder||[]).join("\n"))}</textarea></label></div><div class="row"><input id="mu" style="width:100%" dir="ltr" value="${esc(s.monitorUrl)}" placeholder="رابط جدول المراقبات (GitHub Pages)"></div><button class="b" id="sv">حفظ</button><span id="m"></span></div>
 <div class="panel"><h3>التجديد السنوي</h3><p>الفرق الحالية: ${cl.map(esc).join("، ")||"لا يوجد"}</p>
 <div class="row"><label style="width:100%">خريطة الترقية (سطر لكل صف: القديم=الجديد، أو القديم=حذف)<br><textarea id="pm" rows="5" style="width:100%" dir="ltr">${esc(s.promo||"6ب=1ع\n1ع=2ع\n2ع=3ع\n3ع=حذف")}</textarea></label></div><div class="row"><button class="b" id="prom">ترقية الكل للصف التالي</button><button class="b g" id="grad">حذف صف معين (تخرج)</button><button class="b g" id="newyr">بدء عام جديد وأرشفة الغياب</button></div>
 <small>الترقية تزيد رقم الصف الأول في الفرقة (مثال 7/1 تصبح 8/1). سيطلب منك تأكيد قبل أي تغيير، ويُحفظ نسخة احتياطية قبل التنفيذ.</small></div>
 <div class="panel"><h3>بيانات</h3><div class="row"><button class="b g" id="demo">تحميل بيانات تجريبية</button><button class="b g" id="bk">نسخة احتياطية</button><input type="file" id="rs" accept=".json"><button class="b r" id="wipe">مسح كل البيانات</button></div></div>`;
 $("#sv").onclick=()=>{Object.assign(D.settings,{school:$("#sc").value,country:$("#co").value,year:$("#yr").value,monitorUrl:$("#mu").value.trim(),deptOrder:$("#do").value.split(/\n/).map(x=>x.trim()).filter(Boolean)});save();title();$("#m").textContent=" تم الحفظ ✅"};
 const backup=()=>D.archive.push({at:new Date().toISOString(),students:JSON.stringify(D.students)});
 $("#prom").onclick=()=>{s.promo=$("#pm").value;const M={};s.promo.split(/\n/).forEach(l=>{const [a,b]=l.split("=").map(x=>x.trim());if(a&&b)M[nz(a)]=b});
  const sp=c=>{const m=nz(c).match(/^(\d+)([^\d]*)(\d*)$/);return m?{g:m[1]+m[2],n:m[3]}:null};
  let mv=0,del=0,unk=new Set();D.students.forEach(x=>{const p=sp(x.cls);const t=p&&M[p.g];if(!t)unk.add(x.cls);else if(t==="حذف")del++;else mv++});
  if(unk.size){alert("صفوف بلا قاعدة ترقية: "+[...unk].join("، ")+". أضف لها سطرا في الخريطة.");return}
  if(!confirm(`ترقية ${mv} طالب وحذف ${del} طالب (تخرج). سيتم حفظ نسخة قبل التنفيذ. متابعة؟`))return;backup();
  D.students=D.students.map(x=>{const p=sp(x.cls),t=M[p.g];return t==="حذف"?null:{...x,cls:t+p.n}}).filter(Boolean);save();V.settings()};
 $("#grad").onclick=()=>{const g=prompt("اكتب رقم الصف الذي سيحذف (مثال 12)");if(!g)return;const n=D.students.filter(x=>x.cls.startsWith(g+"/")||x.cls===g).length;if(!n||!confirm(`حذف ${n} طالب؟`))return;backup();D.students=D.students.filter(x=>!(x.cls.startsWith(g+"/")||x.cls===g));save();V.settings()};
 $("#newyr").onclick=()=>{if(!confirm("أرشفة الغياب وبدء عام جديد؟"))return;D.archive.push({at:new Date().toISOString(),year:D.settings.year,att:JSON.stringify(D.att)});D.att={};save();V.settings()};
 $("#demo").onclick=()=>{const n=["أحمد","محمد","علي","حسن","يوسف","خالد","عمر","إبراهيم","سلمان","ياسين","كريم","زياد"],f=["السيد","حسين","عبدالله","الصالح","منصور","الكعبي"];
  D.students=[];["7/1","7/2","8/1"].forEach((c,ci)=>{for(let i=0;i<12;i++)D.students.push({name:n[(i+ci)%12]+" "+n[(i*5+ci+3)%12]+" "+f[(i+ci)%6],id:"D"+(1000+ci*100+i),cls:c})});
  D.teachers=[{name:"معلم تجريبي 1",id:"T1",subject:"رياضيات",dept:"العلوم"},{name:"معلم تجريبي 2",id:"T2",subject:"عربي",dept:"اللغات"},{name:"معلم تجريبي 3",id:"T3",subject:"علوم",dept:"العلوم"}];
  save();V.home()};
 $("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="school-backup.json";a.click()};
 $("#rs").onchange=async e=>{try{D=Object.assign(def(),JSON.parse(await e.target.files[0].text()));save();V.home()}catch(x){alert("ملف غير صالح")}};
 $("#wipe").onclick=()=>{if(confirm("مسح كل البيانات؟")){D=def();save();V.home()}};
};
/* router: each section renders on demand, no page reloads */
function title(){$("#ttl").textContent=D.settings.school+" - "+D.settings.country;document.title=D.settings.school}
function route(){nav();if(!D.users.length)return setupV();if(!ME)return loginV();
 let k=(location.hash.replace(/^#\/?/,"")||"home").split("?")[0];if(k==="users"||k==="settings"){if(me().role!=="admin")k="home"}else if(!can(k)||(scope()&&k==="students"))k="home";
 (V[k]||V.home)();document.body.classList.toggle("ro",!canWrite(k)&&k!=="home"&&k!=="backup");scrollTo(0,0)}
function boot(){ME=sessionStorage.su&&D.users.some(u=>u.u===sessionStorage.su)?sessionStorage.su:null;title();route()}
addEventListener("hashchange",route);boot();
</script></body></html>
